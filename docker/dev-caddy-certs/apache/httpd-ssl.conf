Listen 443
SSLCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES
SSLProxyCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES
SSLHonorCipherOrder on 
SSLProtocol all -SSLv3
SSLProxyProtocol all -SSLv3
SSLPassPhraseDialog  builtin
SSLSessionCache        "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
SSLSessionCacheTimeout  300

<VirtualHost _default_:443>
    DocumentRoot "/usr/local/apache2/htdocs"
    ServerName www.dev.internal:443
    ServerAdmin user001@www.dev.internal
    ErrorLog /proc/self/fd/2
    TransferLog /proc/self/fd/1

    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/certs/caddy-data/caddy/certificates/local/www.dev.internal/www.dev.internal.crt"
    SSLCertificateKeyFile "/usr/local/apache2/certs/caddy-data/caddy/certificates/local//www.dev.internal/www.dev.internal.key"

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>
    <Directory "/usr/local/apache2/cgi-bin">
        SSLOptions +StdEnvVars
    </Directory>
    BrowserMatch "MSIE [2-5]" \
            nokeepalive ssl-unclean-shutdown \
            downgrade-1.0 force-response-1.0
    CustomLog /proc/self/fd/1 \
            "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

    # リバースプロキシの設定
    ProxyRequests Off
    ProxyPreserveHost On

    # HTTPS リクエストをパスすることを伝えるヘッダーの追加
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # すべてのアクセス (/) を http://php-apache へ転送
    ProxyPass / http://php-apache/
    ProxyPassReverse / http://php-apache/
</VirtualHost>