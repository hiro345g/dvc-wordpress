events { worker_connections 16; }
http {
    # 共通のSSL設定
    ssl_certificate /etc/nginx/certs/caddy-data/caddy/certificates/local/www.dev.internal/www.dev.internal.crt;
    ssl_certificate_key /etc/nginx/certs/caddy-data/caddy/certificates/local/www.dev.internal/www.dev.internal.key;

    # HTTP 用
    server {
        listen 80;
        server_name www.dev.internal;
        client_max_body_size 2G;
        location / {
            proxy_pass http://php-apache:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # HTTPS 用
    server {
        listen 443 ssl;
        server_name www.dev.internal;
        client_max_body_size 2G;
        location / {
            proxy_pass http://php-apache:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
