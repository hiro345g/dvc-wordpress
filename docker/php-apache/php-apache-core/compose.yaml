name: php-apache-core

services:
  php-apache:
    image: dvc-wordpress:php-apache-202611
    container_name: php-apache
    hostname: php-apache
    tty: true
    user: ${USER_UID:-1000}:${USER_GID:-1000}
    ports:
      - ${PHP_IP_PORT:-127.0.0.1:8080}:80
      - ${PHP_BUILT_IN_IP_PORT:-127.0.0.1:10080}:10080
    volumes:
      - type: volume
        source: php-apache-data
        target: /var/www
      - type: bind
        source: ${LOCAL_WORKSPACE_FOLDER:-../../..}/docker/php-apache
        target: /php-apache
      - type: bind
        source: ${LOCAL_WORKSPACE_FOLDER:-../../..}/workspace_share/
        target: /share/
      # dvc-wordpress:php-apache-202611 イメージで使う PHP や Apache2 の設定を変更したい場合は、必要なファイルを用意してから上記のバインドマウントを有効化

  php-apache-db:
    # MariaDB 10.6以上に対応
    image: mariadb:12.3.3-noble
    # MySQL 8.4 系を使う場合は下記, oraclelinux 系のみ
    # image: mysql:8.4.9-oraclelinux9
    # MySQL 8.0 系を使う場合は下記, trixie はない
    # image: mysql:8.0.46-bookworm
    container_name: php-apache-db
    hostname: php-apache-db
    volumes:
      # MariaDB も MySQL も同じ `/var/lib/mysql` を使用
      - type: volume
        source: php-apache-db-data
        target: /var/lib/mysql
    ports:
      - ${MYSQL_IP_PORT:-127.0.0.1:13306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-php-apachepass001}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-dbuser001}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dbpass001}
      # MariaDB は MySQL と同じ環境変数をそのまま使える。下記に置き換えても良い。
      # MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-php-apachepass001}
      # MARIADB_DATABASE: ${MARIADB_DATABASE:-wordpress}
      # MARIADB_USER: ${MARIADB_USER:-dbuser001}
      # MARIADB_PASSWORD: ${MARIADB_PASSWORD:-dbpass001}
    healthcheck:
      # MariaDB 用
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      # MySQL 用
      # test: "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"
      start_interval: 1s
      start_period: 10s
      timeout: 1s
      interval: 30s
      retries: 10

  php-apache-adminer:
    image: adminer:6.3.0-standalone
    container_name: php-apache-adminer
    hostname: php-apache-adminer
    ports:
      - ${ADMINER_IP_PORT:-127.0.0.1:5080}:8080
    environment:
      ADMINER_DEFAULT_SERVER: php-apache-db
    depends_on:
      php-apache-db:
        condition: service_healthy

volumes:
  php-apache-data:
    name: dvc-wordpress-php-apache-data
  php-apache-db-data:
    name: dvc-wordpress-php-apache-db-data
