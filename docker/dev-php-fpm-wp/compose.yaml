name: dev-php-fpm-wp

services:
  dev-php-fpm-wp:
    image: dvc-wordpress:dev-php-fpm-wp-202611
    container_name: dev-php-fpm-wp
    hostname: dev-php-fpm-wp
    volumes:
      - type: volume
        source: wordpress-data
        target: /var/www/html
    networks:
      - dvc-net

  dev-php-fpm-wp-nginx:
    image: dvc-wordpress:dev-php-fpm-wp-nginx-202611
    container_name: dev-php-fpm-wp-nginx
    hostname: dev-php-fpm-wp-nginx
    volumes:
      - type: volume
        source: wordpress-data
        target: /var/www/html
        read_only: true
      # Docker イメージの再ビルドをせずに Nginx の設定変更をしたい場合はバインドマウントを有効化
      # - type: bind
      #   source: ${LOCAL_WORKSPACE_FOLDER:-../..}/docker/dev-php-fpm-wp/build-image/etc_nginx_conf.d/default.conf
      #   target: /etc/nginx/conf.d/default.conf
    depends_on:
      - dev-php-fpm-wp
    networks:
      - dvc-net

volumes:
  wordpress_data:
    name: dvc-wordpress-fpm-data

include:
  - ../dev-common/compose-db.yaml
