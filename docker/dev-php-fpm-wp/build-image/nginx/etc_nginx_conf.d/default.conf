server {
    listen 80;
    # dev-php-fpm-wp-nginx は compose.yaml に依存
    server_name dev-php-fpm-wp-nginx;

    root /var/www/html;
    index index.php;

    # WordPressのパーマリンク対応
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPMへのリクエスト転送
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # dev-php-fpm-wp は compose.yaml に依存
        fastcgi_pass dev-php-fpm-wp:9000; # dev-php-fpm-wp コンテナの9000番ポートへパス
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }
}
