# php-apache-https:/etc/apache2/sites-available/default-ssl.conf
<VirtualHost _default_:443>
    # 使用するホスト名に www.dev.internal を書き換える
    ServerName www.dev.internal
    #DocumentRoot /var/www/html
    DocumentRoot /home/node/workspace/php/html

    # SSLの有効化
    SSLEngine on

    # mkcert で作った「証明書」のパス
    SSLCertificateFile /etc/ssl/certs/site.pem

    # mkcert で作った「秘密鍵」のパス
    SSLCertificateKeyFile /etc/ssl/private/site.key

    # (オプション) ログ設定など
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# --- ファイルをコピー
# sudo cp www.dev.internal.pem /etc/ssl/certs/site.pem
# sudo cp www.dev.internal-key.pem /etc/ssl/private/site.key

# --- 秘密鍵のパーミッションを厳しく設定（所有者のみ読み込み可能）
# sudo chmod 600 /etc/ssl/private/key.pem

# --- 設定ファイルの文法チェック
# apache2ctl configtest
